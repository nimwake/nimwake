# Release Gate
#
# 요구사항: .docs/prd/03-delivery/06-ci-strategy.md (PRD §44),
#           .docs/prd/03-delivery/04-stress-tests.md (PRD §43),
#           .docs/prd/03-delivery/07-performance-baseline.md (PRD §73)
#
# 차단 사유로 삼는 것은 **correctness뿐이다.**
#
#   duplicate process == 0
#   orphan process    == 0
#   deadlock          == 0
#   lost waiter       == 0
#   HTTP errors       == 0
#
# 성능 수치는 gate가 아니라 리포트로 누적한다. GitHub-hosted runner는 편차가 커서
# 절대 수치를 gate로 쓰기에 적절하지 않다. baseline이 충분히 쌓인 뒤에
# `proxy overhead +30% 이상` 같은 상대 threshold를 도입한다.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # correctness gate. 여기가 실패하면 artifact를 publish하지 않는다.
  qualify:
    name: correctness + stress
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      # daemon은 자기 버전을 `CARGO_PKG_VERSION`으로 알린다. 그것이 태그와 다르면
      # 운영 로그만으로 어떤 release가 도는지 알 수 없다. 실제로 `v0.1.0-rc1`의
      # nimwaked가 `0.0.1`을 알렸다. (이슈 #24)
      #
      # 빌드보다 먼저 본다. 어긋났으면 5분을 쓰기 전에 멈추는 편이 낫다.
      # 버전 추출은 **태그가 아닐 때도** 실행한다.
      #
      # 비교 자체는 태그에서만 의미가 있지만, 깨지기 쉬운 쪽은 추출이다.
      # 태그에서만 돌게 두면 workflow_dispatch로 확인할 수 없고, 그러면 다음
      # 태그에서 처음 실행된다. 이 세션에서 이미 두 번 그 함정에 빠졌다.
      #
      # jq를 쓰지 않는다. 개발 머신(WSL)에 없어서 로컬에서 확인할 수 없었다.
      # pkgid는 `...#name@version` 또는 `...#version`으로 나온다. 마지막
      # `#` 또는 `@` 뒤를 취하면 두 형태 모두 버전이다.
      - name: Read the crate version
        id: crate
        run: |
          version=$(cargo pkgid -p nimwaked | sed 's/.*[#@]//')
          if [ -z "${version}" ]; then
            echo "::error::could not read the crate version from cargo pkgid"
            cargo pkgid -p nimwaked >&2
            exit 1
          fi
          echo "nimwaked ${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # daemon은 자기 버전을 `CARGO_PKG_VERSION`으로 알린다. 그것이 태그와 다르면
      # 운영 로그만으로 어떤 release가 도는지 알 수 없다. 실제로 `v0.1.0-rc1`의
      # nimwaked가 `0.0.1`을 알렸다. (이슈 #24)
      #
      # 빌드보다 먼저 본다. 어긋났으면 5분을 쓰기 전에 멈추는 편이 낫다.
      - name: Assert the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.crate.outputs.version }}
        run: |
          expected="v${VERSION}"

          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the crate version (expected ${expected})"
            echo "bump [workspace.package] version in Cargo.toml, or retag" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches the crate version"

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-

      - name: Build
        timeout-minutes: 20
        run: cargo build --workspace --release

      # 단위 · 동시성 · lifecycle · gateway · E2E가 모두 여기 들어 있다.
      - name: Tests
        timeout-minutes: 20
        run: cargo test --workspace --all-features --release

      # 직전 release의 baseline. 없으면 이번 것이 첫 baseline이 된다.
      - name: Fetch the previous baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --pattern baseline.txt --dir previous 2>/dev/null \
            || echo "no previous release to compare against"

      # cold-start storm · lifecycle stress · sustained warm load · 누수 검증. (PRD §42–§43)
      # 이 단계가 실패하면 release가 멈춘다.
      - name: Stress and leak checks
        timeout-minutes: 25
        run: |
          compare=""
          if [ -f previous/baseline.txt ]; then
            compare="--baseline previous/baseline.txt"
          fi

          # shellcheck disable=SC2086
          ./target/release/nimwake-bench \
            --commit "${GITHUB_REF_NAME}" \
            --stress \
            --out performance-report.md \
            --baseline-out baseline.txt \
            ${compare}

      - name: Publish the report to the job summary
        if: always()
        run: cat performance-report.md >> "${GITHUB_STEP_SUMMARY}" || true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: |
            performance-report.md
            baseline.txt
          retention-days: 365

      # daemon과 child가 모두 정리됐는지 본다. (Invariant 10 / PRD §71)
      - name: Assert nothing survived
        run: |
          leftover=$(pgrep -c -x nimwaked || true)
          if [ "${leftover}" != "0" ]; then
            echo "::error::${leftover} nimwaked process(es) survived the run"
            exit 1
          fi
          echo "no nimwaked left behind"

  # aarch64 Linux 바이너리. Android 실기기 검증이 이것을 쓴다. (이슈 #3)
  #
  # musl static으로 빌드해 proot Ubuntu의 glibc 버전과 무관하게 실행되도록 한다.
  # 빌드 방식은 `cross`다. Docker만 있으면 되고 Rust 생태계의 표준 경로다.
  aarch64:
    name: aarch64 musl binaries
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install cross
        timeout-minutes: 15
        run: cargo install cross --locked --version 0.2.5

      - name: Build
        timeout-minutes: 30
        run: cross build --release --workspace --target aarch64-unknown-linux-musl

      - name: Collect binaries
        timeout-minutes: 10
        run: |
          out="nimwake-aarch64-${GITHUB_SHA}"
          mkdir -p "${out}"
          src=target/aarch64-unknown-linux-musl/release

          # nimwake-bench가 들어가는 이유가 있다. PRD §50은 Android 검증이 별도 metric
          # 체계를 만들지 않고 **CI Linux와 같은 workload로 실행해 비교**하라고 한다.
          # 그 workload를 만드는 것이 이 도구다. 기기에 없으면 비교를 할 수 없다.
          #
          # bench는 nimwaked · echo-server · crash-server를 자기 옆에서 찾으므로
          # 네 바이너리가 같은 디렉터리에 있어야 한다.
          for binary in nimwake-bench nimwaked echo-server crash-server group-server slow-start-server; do
            cp "${src}/${binary}" "${out}/"
          done

          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "target=aarch64-unknown-linux-musl"
            echo "built_with=cross $(cross --version 2>/dev/null | sed -n 1p)"
            echo "rustc=$(rustc --version)"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${out}/BUILD_INFO"

          file "${out}/nimwaked"
          echo "OUT_DIR=${out}" >> "${GITHUB_ENV}"

      # Android 동작을 CI가 증명하지는 않는다. 바이너리가 aarch64에서 실행은 되는지만 본다.
      # manifest가 없으므로 설정 오류(78)로 끝나야 한다. (PRD §74)
      - name: Smoke under qemu
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          mkdir -p empty-apps

          set +e
          # nimwaked는 로그를 stdout에 쓴다. stderr만 받으면 smoke.log가 비어 아래 grep이 실패한다.
          qemu-aarch64-static "${OUT_DIR}/nimwaked" --apps empty-apps >smoke.log 2>&1
          code=$?
          set -e

          cat smoke.log
          if [ "${code}" != "78" ]; then
            echo "::error::expected exit code 78 (EX_CONFIG), got ${code}"
            exit 1
          fi
          grep -q "no manifests found" smoke.log
          echo "aarch64 binary runs and reports a configuration failure"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT_DIR }}
          path: ${{ env.OUT_DIR }}/
          retention-days: 90

  # correctness gate를 통과해야만 여기까지 온다.
  publish:
    name: publish release
    needs: [qualify, aarch64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          mkdir -p release
          cp artifacts/performance-report/performance-report.md release/
          cp artifacts/performance-report/baseline.txt release/
          tar -czf "release/nimwake-aarch64-linux-musl.tar.gz" \
            -C "artifacts/nimwake-aarch64-${GITHUB_SHA}" .
          ls -la release

      # 릴리스 노트는 제약이 먼저 오고 성능 표가 뒤에 온다.
      # 쓰는 쪽이 "보장하지 않는 것"을 숫자보다 먼저 읽어야 한다. (v0.1.0 마일스톤)
      - name: Compose the release notes
        run: |
          cat .github/release-notes-preamble.md > notes.md
          echo >> notes.md
          cat release/performance-report.md >> notes.md
          wc -l notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `v0.1.0-rc1`처럼 하이픈이 있으면 prerelease다. (semver 관례)
          # 표시해 두지 않으면 rc가 latest release가 되고, 다음 release의
          # baseline 비교가 rc를 직전 값으로 집어 간다.
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease="--prerelease" ;;
          esac

          # shellcheck disable=SC2086
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            ${prerelease} \
            release/*
