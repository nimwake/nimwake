# Pull Request — Fast CI
#
# 요구사항: .docs/prd/03-delivery/06-ci-strategy.md (PRD §44)
#
# 목적: fast feedback + lifecycle correctness.
# 실제 daemon E2E는 integration CI(v0.0.4), storm/stress는 release gate(v0.0.5)에서 다룬다.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에서 새 push가 오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # toolchain과 component는 rust-toolchain.toml이 결정한다.
      # 첫 cargo 호출에서 rustup이 자동으로 설치한다.
      # 예제(`examples/hello-node`)를 실제로 띄우는 E2E가 있다.
      # node가 없으면 그 테스트는 조용히 건너뛰므로, 여기서 반드시 깔아 둔다.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # lifecycle 상태 전이 / stale event / cold-start deduplication을 모두 포함한다.
      # Nimwake에서 concurrency test는 first-class correctness test다. (PRD §40)
      - name: Test
        timeout-minutes: 15
        run: cargo test --workspace --all-features

      # **선언한 MSRV로 실제 빌드한다.**
      #
      # rust-toolchain.toml이 `stable`을 고정하므로 다른 job은 전부 최신으로
      # 돈다. 그래서 `rust-version`은 검증되지 않는 숫자였고 실제로 틀려
      # 있었다 — 1.75로 적혀 있었지만 의존성 트리는 1.85를 요구했다.
      #
      # 테스트까지 돌리지 않는다. 컴파일되는지가 MSRV의 뜻이고, 그 이상은
      # 다른 job이 최신 toolchain에서 한다.
      - name: Build at the declared MSRV
        run: |
          msrv="$(grep -m1 '^rust-version' Cargo.toml | tr -d '"' | awk '{print $3}')"
          # **두 곳이 같아야 한다.** 어긋나면 clippy가 clippy.toml을 쓰고,
          # 그러면 lint가 실제보다 낮은 기준으로 돈다. 실제로 어긋나 있었다.
          lint="$(grep -m1 '^msrv' clippy.toml | tr -d '"' | awk '{print $3}')"
          if [ "${msrv}" != "${lint}" ]; then
            echo "::error::Cargo.toml says ${msrv} but clippy.toml says ${lint}"
            exit 1
          fi
          echo "declared MSRV: ${msrv}"
          rustup toolchain install "${msrv}" --profile minimal --no-self-update
          cargo "+${msrv}" check --workspace --all-features --locked

      # 상한 없는 대기열은 Invariant 9 위반이다. 리뷰에 의존하지 않고 기계로 막는다.
      - name: Forbid unbounded queues
        run: |
          if grep -rn "unbounded_channel" crates/ ; then
            echo "::error::unbounded channel found — see PRD §69 Backpressure (Invariant 9)"
            exit 1
          fi

      # Child를 소유하는 코드 경로는 ProcessController 하나뿐이어야 한다. (PRD §70)
      # AppManager와 monitor가 같은 Child를 다루기 시작하면 소유권 규칙이 조용히 무너진다.
      - name: Forbid Child ownership outside ProcessController
        run: |
          leaks=$(grep -rn "^use tokio::process" crates/nimwake-core crates/nimwaked --include="*.rs" | grep -v "controller.rs" || true)
          if [ -n "$leaks" ]; then
            echo "::error::tokio::process imported outside ProcessController — see PRD §70 Process Ownership"
            echo "$leaks"
            exit 1
          fi

      # Invariant 2 — lifecycle state를 바꾸는 주체는 AppManager 하나뿐이다.
      #
      # `AppState`는 읽기 접근자만 노출하므로 바깥에서 직접 바꿀 수는 없다.
      # 남은 경로는 **순수 전이 함수를 두 번째 장소에서 적용하는 것**이다.
      # 그러면 상태 변경 주체가 둘이 되고 불변식이 깨진다.
      - name: Forbid a second lifecycle authority
        run: |
          leaks=$(grep -rln "transition::" crates/nimwake-core/src --include="*.rs"             | grep -v "app/manager.rs" | grep -v "app/transition" || true)
          if [ -n "$leaks" ]; then
            echo "::error::transitions applied outside AppManager — see PRD §12 Invariant 2"
            echo "$leaks"
            exit 1
          fi

      # blocking HTTP client를 단일 스레드 runtime에서 직접 부르면 같은 runtime의
      # task(gateway, stdout/stderr drain)가 굶는다. 증상은 "client 읽기 시간 초과"로
      # 나타나 원인을 찾기 어렵다. §19를 지킨다던 테스트가 이 함정 때문에 drain을
      # 제거해도 통과하고 있었다.
      #
      # gateway.rs의 모듈 doc이 이미 경고했는데 process_runtime.rs가 밟았다.
      # 한 파일의 경고는 옆 파일에 닿지 않으므로 검사로 옮긴다.
      - name: Forbid blocking clients on a single-threaded runtime
        run: python3 scripts/check-blocking-clients.py

      # Invariant 6 — 오래 걸리는 작업은 AppManager의 event loop 밖에서 수행한다.
      #
      # 판단 경로(`transition`)는 **동기 순수 함수**다. async가 아니면 애초에
      # 기다릴 수 없고, process 기동·종료·readiness 폴링은 `Effect`로 나가 별도
      # task에서 수행된다. 여기에 async가 들어오면 그 보장이 사라진다.
      - name: Keep the decision path synchronous
        run: |
          leaks=$(grep -nE "async fn|\.await" crates/nimwake-core/src/app/transition.rs             | grep -v "^[0-9]*://" || true)
          if [ -n "$leaks" ]; then
            echo "::error::the transition function must stay synchronous — see PRD §12 Invariant 6"
            echo "$leaks"
            exit 1
          fi

      # Invariant 3 — Gateway는 application process를 직접 시작·종료하지 않는다.
      #
      # `app.acquire()` 하나만 쓴다. runtime이나 AppManager를 들이면 gateway가
      # lifecycle을 직접 건드릴 수 있게 되고, 깨어날지 말지의 판단이 두 곳으로 갈린다.
      - name: Forbid the gateway from reaching into the lifecycle
        run: |
          leaks=$(grep -rn "^use crate::runtime\|^use crate::app::.*AppManager\|^use crate::app::.*AppState"             crates/nimwake-core/src/gateway --include="*.rs" || true)
          if [ -n "$leaks" ]; then
            echo "::error::gateway reached past acquire() — see PRD §12 Invariant 3"
            echo "$leaks"
            exit 1
          fi
