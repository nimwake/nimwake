[workspace]
resolver = "2"
members = [
  "crates/nimwake-bench",
  "crates/nimwake-core",
  "crates/nimwake-fixtures",
  "crates/nimwaked",
]

[workspace.package]
# release 태그와 같은 값을 유지한다. `release.yml`의 qualify job이 다르면 실패시킨다.
#
# `v0.1.0-rc1`의 nimwaked가 자기 버전을 `0.0.1`로 알리는 문제가 있었다.
# 운영 로그만으로 어떤 release가 도는지 알 수 없었다. (이슈 #24)
version = "0.1.0-rc6"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/nimwake/nimwake"

[workspace.dependencies]
nimwake-core = { path = "crates/nimwake-core" }

async-trait = "0.1"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "server-graceful", "tokio"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
nix = { version = "0.29", default-features = false, features = ["signal"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
