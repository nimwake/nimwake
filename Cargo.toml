[workspace]
resolver = "2"
members = ["crates/nimwake-core", "crates/nimwake-fixtures", "crates/nimwaked"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/nimwake/nimwake"

[workspace.dependencies]
nimwake-core = { path = "crates/nimwake-core" }

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
nix = { version = "0.29", default-features = false, features = ["signal"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
