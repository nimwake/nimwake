[workspace]
resolver = "2"
members = [
  "crates/nimwake-bench",
  "crates/nimwake-core",
  "crates/nimwake-fixtures",
  "crates/nimwaked",
]

[workspace.package]
# release 태그와 같은 값을 유지한다. `release.yml`의 qualify job이 다르면 실패시킨다.
#
# `v0.1.0-rc1`의 nimwaked가 자기 버전을 `0.0.1`로 알리는 문제가 있었다.
# 운영 로그만으로 어떤 release가 도는지 알 수 없었다. (이슈 #24)
version = "0.1.1"
edition = "2021"
# 의존성 트리가 요구하는 값이다 — 우리가 고른 하한이 아니다.
#
# `toml` 1.x · `tokio` 1.54 · `hashbrown` 0.17이 1.85를 요구한다. 전에는 1.75로
# 적혀 있었지만 **아무도 그 버전으로 빌드해 보지 않았다** — rust-toolchain.toml이
# `stable`을 고정하고 CI도 그것을 쓴다. 검증하지 않는 숫자는 조용히 거짓이 된다.
#
# 아래 ci.yml의 "Build at the declared MSRV"가 이제 이 값을 지킨다.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/nimwake/nimwake"

[workspace.dependencies]
nimwake-core = { path = "crates/nimwake-core" }

async-trait = "0.1"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "server-graceful", "tokio"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
nix = { version = "0.31", default-features = false, features = ["signal"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
